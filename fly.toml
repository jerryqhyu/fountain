# fly.toml app configuration file generated for fountain on 2026-10-11T01:27:54Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'fountain'
primary_region = 'iad'

[build]

[[mounts]]
  source = 'data'
  destination = '/data'

[http_service]
  internal_port = 8000
  force_https = true
  # The in-process scheduler does the polling: the machine must never auto-stop.
  # Run exactly one machine (`fly scale count 1`); two would double-poll and split the SQLite DB.
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    grace_period = '60s'
    interval = '30s'
    method = 'GET'
    path = '/api/health'
    timeout = '10s'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
