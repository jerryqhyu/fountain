[project]
name = "kilauea-dashboard"
version = "0.1.0"
requires-python = ">=3.14.7"
dependencies = [
    "apscheduler>=3.11.3",
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "lxml>=6.1.3",
    "numpy>=2.5.3",
    "obspy>=1.5.1",
    "pandas>=3.0.6",
    "pillow>=12.3.0",
    "pytesseract>=0.3.13",
    "python-dotenv>=1.2.3",
    "scikit-learn>=1.9.1",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
